name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # perlu untuk membuat GitHub Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cek file wajib
        run: |
          for f in package.json capacitor.config.json www/index.html patch-android.py \
                   salasatu.keystore native/MainActivity.java native/PrinterBridgePlugin.java; do
            [ -f "$f" ] || { echo "::error::File wajib tidak ada: $f"; exit 1; }
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependency npm
        run: npm install --no-audit --no-fund

      - name: Salin library PDF ke www
        run: |
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/
          ls -l www

      - name: Tambah platform Android
        run: |
          rm -rf android
          npx cap add android

      - name: Patch proyek Android (plugin printer, izin, signing)
        run: |
          python3 patch-android.py
          grep -q "signingConfigs" android/app/build.gradle || { echo "::error::Patch signing gagal"; exit 1; }
          grep -q "BLUETOOTH_CONNECT" android/app/src/main/AndroidManifest.xml || { echo "::error::Patch manifest gagal"; exit 1; }
          grep -q "targetSdkVersion = 30" android/variables.gradle || { echo "::error::Patch targetSdk gagal"; exit 1; }

      - name: Sinkron Capacitor
        run: npx cap sync android

      - name: Terima lisensi Android SDK
        run: yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK (debug, ditandatangani keystore tetap)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Siapkan & verifikasi APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] || { echo "::error::APK tidak ditemukan"; exit 1; }
          cp "$APK" salasatu-kasir.apk
          BT=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs salasatu-kasir.apk
          ls -lh salasatu-kasir.apk

      - name: Unggah artifact
        uses: actions/upload-artifact@v4
        with:
          name: salasatu-kasir-apk
          path: salasatu-kasir.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Salasatu Kasir v1.${{ github.run_number }}
          files: salasatu-kasir.apk
          fail_on_unmatched_files: true
