name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/jspdf/dist/jspdf.umd.min.js www/ && cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/
      - run: npx cap add android
      - run: python3 patch-android.py
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk salasatu-kasir.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salasatu-kasir-apk
          path: salasatu-kasir.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Salasatu Kasir v1.${{ github.run_number }}
          files: salasatu-kasir.apk
